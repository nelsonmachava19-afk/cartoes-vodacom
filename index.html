<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d141d"><title>Cartões de Vendas — MR MEGAS</title><style>
:root{color-scheme:dark;--bg:#0d141d;--panel:#192431;--line:#2c3a4a;--text:#f4f7fb;--muted:#91a4ba;--blue:#8cafff;--bluebg:#243958}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:930px;margin:0 auto;padding:36px 22px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:30px}.identity{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:13px;background:#22334b;display:grid;place-items:center;color:#b5caff}h1{font-size:25px;letter-spacing:-.6px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:13px}.count{border:1px solid var(--line);border-radius:30px;padding:7px 12px;color:#b9c9dc;white-space:nowrap;font-size:13px}.search{position:relative;margin-bottom:24px}.search input{width:100%;background:#17212d;border:1px solid #304153;border-radius:13px;color:white;padding:14px 16px 14px 44px;font:inherit;outline:none}.search input:focus{border-color:#7599dd;box-shadow:0 0 0 3px #7599dd22}.search svg{position:absolute;left:15px;top:15px;color:#94a8bd}.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.block{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 9px}.block-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 14px;border-bottom:1px solid var(--line);gap:12px}.block-head strong{font-size:16px}.block-head span{font-size:12px;color:var(--muted)}.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0c}.entry:last-child{border-bottom:0}.entry.selected{background:#203c35;box-shadow:inset 3px 0 #69c69e;border-radius:8px;padding-left:10px;padding-right:10px}.entry.selected .id{color:#b5ead2}.details{display:flex;align-items:center;gap:10px;min-width:0;flex:1;justify-content:space-between}.right-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}.id{width:34px;flex-shrink:0;color:#a2b3c8;font-size:13px}.number{font-variant-numeric:tabular-nums;font-size:16px;font-weight:550;letter-spacing:.2px;white-space:nowrap}button{display:flex;align-items:center;gap:7px;background:#24354b;border:1px solid #40536b;border-radius:9px;color:#e4eeff;padding:8px 11px;font:inherit;font-size:13px;cursor:pointer;transition:background .12s}button:hover{background:#304765}button:focus-visible{outline:2px solid #9bbaff;outline-offset:2px}button.done{background:#163d36;border-color:#377d67;color:#b8f4dc}.empty{display:none;text-align:center;padding:34px;color:var(--muted)}footer{color:#73869b;font-size:12px;text-align:center;margin-top:26px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#294936;color:#d6ffe9;border:1px solid #47775a;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}@media(max-width:680px){main{padding:23px 14px 60px}.blocks{grid-template-columns:1fr}h1{font-size:21px}.count{font-size:12px}.block{padding:16px 14px 6px}.details{gap:9px}.number{font-size:15px}}
</style></head><body><main><header class="top"><div class="identity"><div class="logo" aria-hidden="true"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/></svg></div><div><h1>Cartões de Vendas</h1><p>MR MEGAS · Gestão de cartões</p></div></div><div class="count" id="count">52 cartões</div></header><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Pesquisar B34 ou número…" aria-label="Pesquisar cartões" autocomplete="off" spellcheck="false"></div><div class="blocks" id="blocks"></div><div class="empty" id="empty">Nenhum cartão encontrado.</div><footer>Os números não podem ser editados nesta página · Um clique para copiar</footer></main><div id="toast" role="status" aria-live="polite">Número copiado!</div><script>
const cards=[{"id":"B1","number":"846625767","block":0},{"id":"B2","number":"856812032","block":0},{"id":"B3","number":"847139629","block":0},{"id":"B4","number":"859216588","block":0},{"id":"B5","number":"850177628","block":0},{"id":"B6","number":"853600393","block":0},{"id":"B7","number":"846321060","block":0},{"id":"B8","number":"859217567","block":0},{"id":"B9","number":"853876373","block":0},{"id":"B10","number":"847133836","block":0},{"id":"B11","number":"859217011","block":1},{"id":"B12","number":"858726284","block":1},{"id":"B13","number":"847142834","block":1},{"id":"B14","number":"847254812","block":1},{"id":"B15","number":"849329854","block":1},{"id":"B16","number":"858407355","block":1},{"id":"B17","number":"851566660","block":1},{"id":"B18","number":"855951323","block":1},{"id":"B19","number":"852591631","block":1},{"id":"B20","number":"842183961","block":1},{"id":"B21","number":"855762752","block":2},{"id":"B22","number":"858549067","block":2},{"id":"B23","number":"856737348","block":2},{"id":"B24","number":"857011634","block":2},{"id":"B25","number":"851001181","block":2},{"id":"B26","number":"850883797","block":2},{"id":"B27","number":"853468419","block":2},{"id":"B28","number":"844970149","block":2},{"id":"B29","number":"841150734","block":2},{"id":"B30","number":"857384027","block":2},{"id":"B31","number":"851616666","block":3},{"id":"B32","number":"858023211","block":3},{"id":"B33","number":"852971353","block":3},{"id":"B34","number":"855454357","block":3},{"id":"B35","number":"848961334","block":3},{"id":"B36","number":"841493913","block":3},{"id":"B37","number":"858706507","block":3},{"id":"B38","number":"853706911","block":3},{"id":"B39","number":"850670162","block":3},{"id":"B40","number":"842677789","block":3},{"id":"B41","number":"855368829","block":4},{"id":"B42","number":"850772635","block":4},{"id":"B43","number":"855478914","block":4},{"id":"B44","number":"856963431","block":4},{"id":"B45","number":"855374106","block":4},{"id":"B46","number":"850284268","block":4},{"id":"B47","number":"851762891","block":4},{"id":"B48","number":"858142719","block":4},{"id":"B49","number":"858774069","block":4},{"id":"B50","number":"855425103","block":4},{"id":"B51","number":"843596266","block":5},{"id":"B52","number":"841887331","block":5}];
const blocks=document.getElementById('blocks'),search=document.getElementById('search'),count=document.getElementById('count'),empty=document.getElementById('empty'),toast=document.getElementById('toast');
let selectedCardId=null;
const copyIcon='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
function render(){const q=search.value.trim().toLowerCase().replace(/\s+/g,'');const found=cards.filter(c=>c.id.toLowerCase().includes(q)||c.number.includes(q));blocks.replaceChildren();count.textContent=`${found.length} ${found.length===1?'cartão':'cartões'}`;empty.style.display=found.length?'none':'block';for(let b=0;b<6;b++){const group=found.filter(c=>c.block===b);if(!group.length)continue;const section=document.createElement('section');section.className='block';const head=document.createElement('div');head.className='block-head';const label=document.createElement('strong');label.textContent=`Bloco ${b}`;const range=document.createElement('span');range.textContent=`B${b*10+1} — B${(b+1)*10}`;head.append(label,range);section.append(head);for(const c of group){const row=document.createElement('div');row.className='entry';if(c.id===selectedCardId)row.classList.add('selected');const details=document.createElement('div');details.className='details';const id=document.createElement('span');id.className='id';id.textContent=c.id;const num=document.createElement('span');num.className='number';num.textContent=c.number;details.append(num);const right=document.createElement('div');right.className='right-actions';right.append(id);const btn=document.createElement('button');btn.type='button';btn.innerHTML=copyIcon+' <span>Copiar</span>';btn.setAttribute('aria-label',`Copiar ${c.id}: ${c.number}`);btn.addEventListener('click',()=>copy(c.number,c.id,btn));right.append(btn);row.append(details,right);section.append(row)}blocks.append(section)}}
async function copy(number,id,btn){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(number)}else{const el=document.createElement('textarea');el.value=number;el.style.position='fixed';el.style.opacity='0';document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw new Error('Falha ao copiar')}selectedCardId=id;document.querySelectorAll('.entry.selected').forEach(el=>el.classList.remove('selected'));btn.closest('.entry').classList.add('selected');btn.classList.add('done');btn.querySelector('span').textContent='Copiado';toast.textContent=`${number} copiado!`;toast.classList.add('show');setTimeout(()=>{btn.classList.remove('done');btn.querySelector('span').textContent='Copiar';toast.classList.remove('show')},1500)}catch(e){toast.textContent='Não foi possível copiar. Usa HTTPS no Vercel.';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2800)}}
search.addEventListener('input',render);render();
</script></body></html>
